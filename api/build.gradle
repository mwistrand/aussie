plugins {
    id 'java'
    id 'jacoco'
    id 'io.quarkus'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'me.champeau.jmh' version '0.7.3'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-vertx'
    implementation 'io.quarkus:quarkus-reactive-routes'
    implementation 'io.quarkus:quarkus-websockets-next'
    implementation 'io.smallrye.reactive:smallrye-mutiny-vertx-web-client'

    // Cassandra driver (standalone)
    implementation 'org.apache.cassandra:java-driver-core:4.18.1'
    implementation 'org.apache.cassandra:java-driver-query-builder:4.18.1'

    // Redis support (Quarkus extension)
    implementation 'io.quarkus:quarkus-redis-client'

    // Health checks
    implementation 'io.quarkus:quarkus-smallrye-health'

    // Scheduler for scheduled tasks (key rotation)
    implementation 'io.quarkus:quarkus-scheduler'

    // OpenTelemetry for distributed tracing
    implementation 'io.quarkus:quarkus-opentelemetry'

    // Micrometer for metrics
    implementation 'io.quarkus:quarkus-micrometer'
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'

    // RFC 7807 Problem Details for error responses
    implementation 'io.quarkiverse.resteasy-problem:quarkus-resteasy-problem:3.21.0'

    // Security (RBAC with @RolesAllowed)
    implementation 'io.quarkus:quarkus-security'

    // Bean Validation (JSR-380)
    implementation 'io.quarkus:quarkus-hibernate-validator'

    // JWT/JOSE library for token validation and issuance
    implementation 'org.bitbucket.b_c:jose4j:0.9.4'

    // High-performance caching with TTL support
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Guava for BloomFilter (token revocation)
    implementation 'com.google.guava:guava:33.0.0-jre'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'org.wiremock:wiremock:3.3.1'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.testcontainers:testcontainers:1.19.8'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.8'
    testImplementation 'org.awaitility:awaitility:4.2.0'
}

group = 'aussie'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    e2eTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    e2eTestImplementation.extendsFrom implementation
    e2eTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    e2eTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    e2eTestImplementation 'org.junit.platform:junit-platform-launcher:1.10.2'
    e2eTestImplementation 'io.rest-assured:rest-assured:5.4.0'
    e2eTestImplementation 'org.testcontainers:testcontainers:1.19.8'
    e2eTestImplementation 'org.testcontainers:cassandra:1.19.8'
    e2eTestImplementation 'org.testcontainers:junit-jupiter:1.19.8'
    e2eTestImplementation 'org.awaitility:awaitility:4.2.0'
    e2eTestImplementation 'org.assertj:assertj-core:3.25.3'
    e2eTestImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    e2eTestImplementation 'org.slf4j:slf4j-simple:2.0.13'
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
    jvmArgs "--add-opens", "java.base/java.lang=ALL-UNNAMED"
    finalizedBy jacocoTestReport
}

tasks.register('e2eTest', Test) {
    description = 'Runs end-to-end tests against a containerized gateway + demo.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    shouldRunAfter test
    dependsOn 'quarkusBuild'
    // SuiteBootstrapListener owns a singleton harness; running parallel forks
    // would race the lone Docker network.
    maxParallelForks = 1
    forkEvery = 0
    // Surface the API project root so the harness can locate Dockerfile.e2e
    // and the assembled quarkus-app artifact independently of the launcher CWD.
    systemProperty 'aussie.e2e.apiProjectDir', project.projectDir.absolutePath
    // This repo's Gradle root project is api/, so project.rootDir == project.projectDir.
    // The harness needs the actual repo root (one level up) to locate demo/.
    systemProperty 'aussie.e2e.repoRootDir', project.rootDir.parentFile.absolutePath
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'FULL'
        events 'started', 'passed', 'skipped', 'failed', 'standard_out', 'standard_error'
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

jmh {
    fork = (findProperty('jmh.fork') ?: '2').toInteger()
    warmupIterations = (findProperty('jmh.warmupIterations') ?: '5').toInteger()
    iterations = (findProperty('jmh.iterations') ?: '5').toInteger()
    jmhVersion = '1.37'
    failOnError = true
    resultFormat = 'JSON'
    zip64 = true
    if (project.hasProperty('jmh.includes')) {
        includes = [project.property('jmh.includes').toString()]
    }
}

dependencies {
    jmhImplementation 'org.mockito:mockito-core:5.11.0'
}

tasks.named('jmhJar') {
    zip64 = true
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat()
        removeUnusedImports()
        importOrder('java', 'jakarta', '', 'aussie')
        trimTrailingWhitespace()
        endWithNewline()
    }
}
