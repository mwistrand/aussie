# Production Configuration Profile
# Activate with: -Dquarkus.profile=prod or QUARKUS_PROFILE=prod

# =============================================================================
# Storage Configuration (Production)
# =============================================================================

# Use Cassandra for persistent storage
aussie.storage.repository.provider=cassandra
aussie.auth.storage.provider=cassandra
aussie.auth.roles.storage.provider=cassandra
aussie.session.storage.provider=redis
aussie.auth.pkce.storage.provider=redis
aussie.translation-config.storage.provider=cassandra

# Enable Redis caching
aussie.storage.cache.enabled=true
aussie.storage.cache.provider=redis
aussie.storage.cache.ttl=PT15M

# =============================================================================
# Cassandra Configuration (Production)
# =============================================================================

# Contact points - configure via environment variable
aussie.storage.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost:9042}

# Datacenter
aussie.storage.cassandra.datacenter=${CASSANDRA_DATACENTER:datacenter1}

# Keyspace
aussie.storage.cassandra.keyspace=${CASSANDRA_KEYSPACE:aussie}

# Authentication
aussie.storage.cassandra.username=${CASSANDRA_USERNAME:}
aussie.storage.cassandra.password=${CASSANDRA_PASSWORD:}

# =============================================================================
# Quarkus Redis Configuration (Production)
# =============================================================================

quarkus.redis.hosts=${REDIS_HOSTS:}
quarkus.redis.password=${REDIS_PASSWORD:}

# Connection pool settings for production
quarkus.redis.max-pool-size=10
quarkus.redis.max-pool-waiting=24

# =============================================================================
# CORS Configuration
# =============================================================================

# Enable CORS support for gateway requests
aussie.gateway.cors.enabled=true
aussie.gateway.cors.allowed-origins=${AUSSIE_GATEWAY_CORS_ALLOWED_ORIGINS:__deny_all__}

# No upstream is routable until its host is explicitly supplied by the platform.
aussie.gateway.security.allowed-upstream-hosts=${AUSSIE_GATEWAY_SECURITY_ALLOWED_UPSTREAM_HOSTS:}
aussie.gateway.security.allow-private-upstreams=${AUSSIE_GATEWAY_SECURITY_ALLOW_PRIVATE_UPSTREAMS:false}

# Containment guardrails for legacy identity-construction endpoints.
aussie.session.public-creation-enabled=false
aussie.auth.oidc.public-endpoints-enabled=false

# =============================================================================
# Security Headers Configuration (Production)
# =============================================================================

# Enable HSTS when behind TLS termination
# aussie.gateway.security-headers.strict-transport-security=max-age=31536000; includeSubDomains

# =============================================================================
# API Key Encryption (Production)
# =============================================================================

# REQUIRED under prod: a 256-bit base64 key used to AES-GCM encrypt API key
# records at rest. Startup will fail if this is unset/blank under the prod
# profile. Generate with ApiKeyEncryptionService.generateKey() or:
#   openssl rand -base64 32
aussie.auth.encryption.key=${AUTH_ENCRYPTION_KEY:}

# Migration knob: set to true ONLY while migrating legacy PLAIN: records.
# Disable as soon as no PLAIN: records remain.
aussie.auth.encryption.allow-plaintext-reads=false
# Required only during a bounded legacy-record migration.
# aussie.auth.encryption.plaintext-reads-expires-at=${AUTH_PLAINTEXT_READS_EXPIRES_AT}

# =============================================================================
# Rate Limit Fallback Behavior (Production)
# =============================================================================

# Behavior when the Redis rate-limit backend is unreachable.
# - DENY:        fail closed (HTTP 429, default)
# - LOCAL_BUCKET: route through the in-memory limiter as a coarse local backup
# - ALLOW:       fail open (legacy; dev/test only)
aussie.rate-limiting.fallback.behavior=DENY
aussie.rate-limiting.redis.enabled=true

# Cross-instance admin retries and audit records.
aussie.admin-mutations.distributed=true

# Required operational signals.
aussie.telemetry.enabled=true
aussie.telemetry.metrics.enabled=true
aussie.telemetry.security.enabled=true
