apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aussie
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aussie
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              aussie.network/ingress: "true"
        - namespaceSelector:
            matchLabels:
              aussie.network/monitoring: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              aussie.network/cassandra: "true"
      ports:
        - protocol: TCP
          port: 9042
    - to:
        - namespaceSelector:
            matchLabels:
              aussie.network/redis: "true"
      ports:
        - protocol: TCP
          port: 6379
    # Dynamic upstreams need an environment-specific allow rule. Keep the base
    # closed so a service registration cannot create an unreviewed egress path.
