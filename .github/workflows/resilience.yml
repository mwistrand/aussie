name: Resilience

on:
  schedule:
    - cron: '30 3 * * 2'
  workflow_dispatch:
    inputs:
      runs:
        description: Number of packaged resilience runs
        required: false
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  packaged-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOAK_RUNS: ${{ inputs.runs || '3' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Run packaged resilience soak
        run: make e2e-soak SOAK_RUNS="$SOAK_RUNS"
      - name: Upload resilience logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resilience-e2e-logs
          path: api/build/e2e-logs/
          if-no-files-found: ignore
