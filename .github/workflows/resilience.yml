name: Resilience

on:
  schedule:
    - cron: '30 3 * * 2'
  workflow_dispatch:
    inputs:
      runs:
        description: Number of packaged resilience runs
        required: false
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  packaged-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOAK_RUNS: ${{ inputs.runs || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Run packaged resilience soak
        run: make e2e-soak SOAK_RUNS="$SOAK_RUNS"
      - name: Upload resilience logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-e2e-logs
          path: api/build/e2e-logs/
          if-no-files-found: ignore
