name: Security

on:
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cli/go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Java static checks
        working-directory: api
        run: ./gradlew --dependency-verification=strict compileJava spotlessCheck
      - name: Go static checks
        working-directory: cli
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: JavaScript static checks
        working-directory: demo
        run: |
          npm ci
          npm run lint

  vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCAN_IMAGE: aussie-security-scan:${{ github.sha }}
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check immutable container inputs
        run: python3 tools/container_contract.py

      - name: Validate vulnerability exceptions
        run: |
          mkdir -p "$RUNNER_TEMP/vulnerability-policy"
          python3 tools/vulnerability_exceptions_test.py
          python3 tools/vulnerability_exceptions.py \
            --source-ignorefile "$RUNNER_TEMP/vulnerability-policy/source.ignore" \
            --image-ignorefile "$RUNNER_TEMP/vulnerability-policy/image.ignore"

      - name: Build release image
        run: docker build --tag "$SCAN_IMAGE" --file api/src/main/docker/Dockerfile.jvm api

      - name: Scan source dependencies
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/src:ro"
          --volume "$RUNNER_TEMP/vulnerability-policy:/policy:ro"
          "$TRIVY_IMAGE" fs
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --ignorefile /policy/source.ignore
          --exit-code 1 /src

      - name: Export release image
        run: docker save "$SCAN_IMAGE" --output "$RUNNER_TEMP/aussie-image.tar"

      - name: Scan release image
        run: >-
          docker run --rm
          --volume "$RUNNER_TEMP:/scan:ro"
          --volume "$RUNNER_TEMP/vulnerability-policy:/policy:ro"
          "$TRIVY_IMAGE" image --input /scan/aussie-image.tar
          --severity HIGH,CRITICAL
          --ignorefile /policy/image.ignore
          --exit-code 1
