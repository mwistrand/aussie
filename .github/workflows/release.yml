name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    needs: checks
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  cli:
    needs: [checks, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: cli/go.mod
          cache: true

      - name: Test CLI
        working-directory: cli
        run: go test -race ./...

      - name: Build CLI release archives
        working-directory: cli
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          build_date="$(git show -s --format=%cI "$RELEASE_COMMIT")"
          while IFS=' ' read -r goos goarch archive; do
            name="aussie-${RELEASE_VERSION}-${goos}-${goarch}"
            binary="$name/aussie"
            [ "$goos" = windows ] && binary="$name/aussie.exe"
            rm -rf "$name"
            mkdir -p "$name"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X github.com/aussie/cli/cmd.Version=$RELEASE_VERSION -X github.com/aussie/cli/cmd.GitCommit=$RELEASE_COMMIT -X github.com/aussie/cli/cmd.BuildDate=$build_date" \
              -o "$binary" .
            if [ "$archive" = zip ]; then
              zip -q -r "../dist/$name.zip" "$name"
            else
              tar -czf "../dist/$name.tar.gz" "$name"
            fi
            rm -rf "$name"
          done <<'TARGETS'
          linux amd64 tar
          linux arm64 tar
          darwin amd64 tar
          darwin arm64 tar
          windows amd64 zip
          TARGETS
          (cd ../dist && sha256sum *.tar.gz *.zip > "aussie-${RELEASE_VERSION}.sha256")

      - name: Generate CLI SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: cli
          format: cyclonedx-json
          output-file: aussie-cli-${{ github.ref_name }}.cdx.json
          upload-artifact: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign and verify CLI archives
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for asset in dist/*.tar.gz dist/*.zip; do
            cosign sign-blob --yes \
              --output-signature "$asset.sig" \
              --output-certificate "$asset.pem" \
              "$asset"
            cosign verify-blob \
              --signature "$asset.sig" \
              --certificate "$asset.pem" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_VERSION}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$asset"
          done

      - name: Attest CLI build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Publish CLI assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" \
              --verify-tag \
              --title "$RELEASE_VERSION" \
              --generate-notes
          fi
          gh release upload "$RELEASE_VERSION" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*.sig \
            dist/*.pem \
            dist/*.sha256 \
            "aussie-cli-${RELEASE_VERSION}.cdx.json" \
            --clobber

      - name: Archive CLI release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aussie-${{ github.ref_name }}-cli
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sig
            dist/*.pem
            dist/*.sha256
            aussie-cli-${{ github.ref_name }}.cdx.json

  image:
    needs: [checks, security, cli]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: api
          file: api/src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ env.IMAGE }}
          provenance: mode=max
          sbom: true

      - name: Generate source SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: .
          format: cyclonedx-json
          output-file: aussie-${{ github.ref_name }}.cdx.json
          upload-artifact: false

      - name: Create release checksums
        run: |
          sha256sum "aussie-${GITHUB_REF_NAME}.cdx.json" > "aussie-${GITHUB_REF_NAME}.sha256"
          sha256sum --check "aussie-${GITHUB_REF_NAME}.sha256"

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify image signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign verify
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "${IMAGE}@${DIGEST}"

      - name: Attach SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign attest --yes
          --type cyclonedx
          --predicate "aussie-${GITHUB_REF_NAME}.cdx.json"
          "${IMAGE}@${DIGEST}"

      - name: Verify SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign verify-attestation
          --type cyclonedx
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "${IMAGE}@${DIGEST}"

      - name: Attach GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write release evidence manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          SBOM_SHA256=$(cut -d ' ' -f 1 "aussie-${GITHUB_REF_NAME}.sha256")
          jq -n \
            --arg version "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg sbom "aussie-${GITHUB_REF_NAME}.cdx.json" \
            --arg sbomSha256 "${SBOM_SHA256}" \
            '{version: $version, commit: $commit, image: $image, digest: $digest,
              sbom: $sbom, sbom_sha256: $sbomSha256,
              compatibility: "docs/platform/release.md", rollback: "docs/platform/release.md"}' \
            > "aussie-${GITHUB_REF_NAME}.evidence.json"

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aussie-${{ github.ref_name }}-evidence
          path: |
            aussie-${{ github.ref_name }}.cdx.json
            aussie-${{ github.ref_name }}.sha256
            aussie-${{ github.ref_name }}.evidence.json

  qualification:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Qualify the released production image
        env:
          AUSSIE_QUALIFICATION_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          AUSSIE_QUALIFICATION_REPORT: api/build/qualification/release-qualification.md
        run: make deployment-qualification

      - name: Upload production qualification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aussie-${{ github.ref_name }}-qualification
          if-no-files-found: error
          path: api/build/qualification/release-qualification.md
