name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CASSANDRA_CONTACT_POINTS: localhost:9042
    services:
      cassandra:
        image: cassandra:4.1.4
        env:
          CASSANDRA_CLUSTER_NAME: aussie-ci
          CASSANDRA_DC: datacenter1
          HEAP_NEWSIZE: 128M
          MAX_HEAP_SIZE: 512M
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 60s
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Java format and tests
        working-directory: api
        run: ./gradlew --dependency-verification=strict spotlessCheck check --rerun-tasks
      - name: Go format, vet, and tests
        working-directory: cli
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go test -race ./...
      - name: Demo lint and build
        working-directory: demo
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Verify builds did not mutate tracked files
        run: git diff --exit-code

  e2e:
    needs: checks
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Packaged artifact E2E
        run: make e2e
