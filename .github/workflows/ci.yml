name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CASSANDRA_CONTACT_POINTS: localhost:9042
      AUSSIE_TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      cassandra:
        image: cassandra:4.1.4
        env:
          CASSANDRA_CLUSTER_NAME: aussie-ci
          CASSANDRA_DC: datacenter1
          HEAP_NEWSIZE: 128M
          MAX_HEAP_SIZE: 512M
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 60s
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Java format and tests
        working-directory: api
        run: ./gradlew --dependency-verification=strict spotlessCheck check --rerun-tasks
      - name: Go format, vet, and tests
        working-directory: cli
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go test -race ./...
      - name: Prepare previous OpenAPI contract
        id: openapi-base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:api/src/main/resources/META-INF/resources/openapi.yaml" 2>/dev/null; then
            git show "$BASE_SHA:api/src/main/resources/META-INF/resources/openapi.yaml" > api/build/openapi-previous.yaml
            # shortcut: normalize the pre-oasdiff baseline, remove after main contains valid response maps.
            sed -i "s|responses: {\$ref: '#/components/responses/Json'}|responses: {default: {\$ref: '#/components/responses/Json'}}|g" api/build/openapi-previous.yaml
            sed -i "s|responses: {\$ref: '#/components/responses/Empty'}|responses: {default: {\$ref: '#/components/responses/Empty'}}|g" api/build/openapi-previous.yaml
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate OpenAPI contract
        uses: oasdiff/oasdiff-action/validate@v0.1.17
        with:
          spec: api/src/main/resources/META-INF/resources/openapi.yaml
          fail-on: ERR
      - name: Check OpenAPI contract compatibility
        if: steps.openapi-base.outputs.available == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.17
        with:
          base: api/build/openapi-previous.yaml
          revision: api/src/main/resources/META-INF/resources/openapi.yaml
          fail-on: WARN
          review: false
      - name: Demo lint and build
        working-directory: demo
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Verify builds did not mutate tracked files
        run: git diff --exit-code

  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Packaged artifact E2E
        run: make e2e

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          cache: gradle
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native artifact
        working-directory: api
        run: ./gradlew --dependency-verification=strict quarkusBuild -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false
      - name: Verify native executable
        working-directory: api
        run: |
          runner=$(find build -maxdepth 1 -type f -name '*-runner' -print -quit)
          test -n "$runner"
          test -x "$runner"
